<style>
html{scroll-behavior:smooth}
body{overflow-x:hidden}
.prog{position:fixed;top:0;left:0;height:3px;background:var(--accent);z-index:80;width:0}
.nav{position:sticky;top:0;z-index:40;background:rgba(251,252,248,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-soft);transition:box-shadow var(--dur-med) var(--ease-out)}
.nav.scrolled{box-shadow:var(--shadow-soft)}
.nav-link{font-size:14.5px;font-weight:600;color:var(--text-body);text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.nav-link i{width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0;transform:scale(.4);transition:opacity var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}
.nav-link.on i{opacity:1;transform:scale(1)}
.nav-link:hover{color:var(--text-accent)}
.intro{position:fixed;inset:0;z-index:100;cursor:pointer}
.intro__veil{position:absolute;inset:0;background:var(--lg-ink-900);transition:transform .6s var(--ease-out) .12s}
.intro__panel{position:absolute;inset:0;background:var(--lg-ink-950);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:transform .6s var(--ease-out)}
.intro.out .intro__panel,.intro.out .intro__veil{transform:translateY(-101%)}
.intro.out{pointer-events:none;visibility:hidden;transition:visibility 0s .7s}
.intro__rings{position:relative;width:110px;height:110px}
.intro__rings img{position:absolute;left:50%;top:50%;width:58px;height:58px;transform:translate(-50%,-50%);border-radius:50%}
.intro__rings i{position:absolute;inset:0;border:2px solid rgba(70,194,175,.55);border-radius:50%;animation:ringp 1.25s var(--ease-out) infinite}
.intro__rings i:nth-child(2){animation-delay:.42s}
@keyframes ringp{0%{transform:scale(.55);opacity:0}30%{opacity:.85}100%{transform:scale(1.55);opacity:0}}
.intro__t{font-family:var(--font-display);font-weight:800;font-size:clamp(56px,9vw,110px);letter-spacing:var(--track-display);color:var(--lg-paper);line-height:1;animation:tpop .45s var(--ease-out)}
.intro__t .acc{color:var(--lg-orange-500)}
.intro__cap{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(251,252,248,.45)}
.intro__bar{position:absolute;bottom:0;left:0;height:3px;background:var(--accent);width:0;animation:introbar 1.75s cubic-bezier(.4,0,.2,1) forwards}
@keyframes introbar{to{width:100%}}
@keyframes tpop{from{opacity:0;transform:translateY(18px)}}
.hd{opacity:0;transform:translateY(24px)}
.play .hd{opacity:1;transform:translateY(0);transition:opacity .65s var(--ease-out) var(--d,0ms),transform .65s var(--ease-out) var(--d,0ms)}
.lmask{display:block;overflow:hidden;padding-bottom:.09em;margin-bottom:-.09em}
.ln{display:block;transform:translateY(118%)}
.play .ln,.wr-on .ln{transform:translateY(0);transition:transform .85s var(--ease-out) var(--d,0ms)}
.rv{opacity:0;transform:translateY(26px)}
.rv.on{opacity:1;transform:translateY(0);transition:opacity .7s var(--ease-out) var(--d,0ms),transform .7s var(--ease-out) var(--d,0ms)}
.floaty{animation:floaty 7s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.parwrap{transition:transform .35s var(--ease-out);will-change:transform}
.hero-orbit{position:absolute;inset:0;pointer-events:none;z-index:2}
.orb{position:absolute;opacity:0;animation:floaty 9s ease-in-out infinite;transition:opacity .8s var(--ease-out) var(--d,0ms)}
.orb .lg-badge{box-shadow:var(--shadow-soft);font-size:12px;padding:7px 14px;white-space:nowrap}
.play .orb{opacity:1}
.rings{position:absolute;left:50%;top:50%;width:130%;aspect-ratio:1/1;pointer-events:none;transition:transform .5s var(--ease-out)}
.rings i{position:absolute;inset:0;border:1.5px solid var(--lg-ink-100);border-radius:50%;animation:breathe 8s ease-in-out infinite}
.rings i:nth-child(2){inset:11%;border-color:var(--lg-ink-50);animation-delay:1.3s}
.rings i:nth-child(3){inset:23%;border-color:var(--lg-ink-50);animation-delay:2.6s}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.hero-wave{width:200px;height:16px;color:var(--accent);margin-top:16px}
.hero-wave path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s var(--ease-out) 1.15s}
.play .hero-wave path{stroke-dashoffset:0}
.trustline{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}
.phonenum{font-variant-numeric:tabular-nums;white-space:nowrap}
.scrollhint{position:absolute;right:34px;bottom:26px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text-muted)}
.scrollhint span{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;writing-mode:vertical-rl}
.scrollhint i{width:2px;height:44px;background:var(--lg-ink-100);position:relative;overflow:hidden;border-radius:2px}
.scrollhint i::after{content:"";position:absolute;left:0;top:-50%;width:100%;height:50%;background:var(--accent);animation:shint 1.8s var(--ease-out) infinite}
@keyframes shint{to{top:110%}}
.mqwrap{margin-top:0;border-block:1px solid var(--border-soft);background:var(--surface-sunken);padding:24px 0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.mq{overflow:hidden}
.mq__track{display:flex;align-items:center;gap:44px;width:max-content;animation:mqmove 40s linear infinite}
.mq--rev .mq__track{animation-direction:reverse;animation-duration:52s}
.mq:hover .mq__track{animation-play-state:paused}
.mq b{font-family:var(--font-display);font-weight:800;font-size:56px;letter-spacing:var(--track-display);line-height:1.1;color:var(--lg-ink-200);white-space:nowrap;transition:color var(--dur-med) var(--ease-out)}
.mq b:hover{color:var(--lg-ink-950)}
.mq__dot{color:var(--accent);font-size:30px;line-height:1}
.mq--sm b{font-size:26px;color:var(--lg-ink-300)}
.mq--sm .mq__dot{font-size:16px;color:var(--lg-teal-500)}
@keyframes mqmove{to{transform:translateX(-50%)}}
.scene{height:330vh;margin-top:100px}
.scene-pin{position:sticky;top:0;min-height:100vh;display:flex;align-items:center;overflow:hidden}
.scene-num{position:absolute;right:-2%;top:4%;font-family:var(--font-display);font-weight:800;font-size:clamp(220px,30vw,430px);line-height:1;color:var(--lg-ink-50);pointer-events:none;user-select:none;animation:tpop .5s var(--ease-out)}
.phases{position:relative;min-height:480px}
.ph{position:absolute;inset:0;opacity:0;transform:translateY(26px);transition:opacity .45s var(--ease-out),transform .45s var(--ease-out);pointer-events:none}
.ph.on{opacity:1;transform:none;pointer-events:auto}
.ph .lg-card{height:100%;box-sizing:border-box}
.rail{position:relative;width:14px;flex:none;align-self:stretch}
.rail em{position:absolute;left:50%;transform:translateX(-50%);width:2px;top:8px;bottom:8px;background:var(--lg-ink-100);border-radius:2px}
.rail b{position:absolute;left:50%;transform:translateX(-50%);width:2px;top:8px;background:var(--accent);border-radius:2px;max-height:calc(100% - 16px)}
.rail u{position:absolute;left:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:var(--surface-page);border:2px solid var(--lg-ink-200);text-decoration:none;transition:background var(--dur-fast),border-color var(--dur-fast)}
.rail u.on{background:var(--accent);border-color:var(--accent)}
.steps-word{font-family:var(--font-display);font-weight:800;font-size:clamp(40px,4.6vw,58px);letter-spacing:var(--track-display);color:var(--text-accent);margin-top:26px;animation:tpop .45s var(--ease-out)}
.wf{display:inline-flex;gap:3px;align-items:center;height:18px}
.wf i{width:3px;height:6px;border-radius:2px;background:var(--live);animation:wfb 1s ease-in-out infinite}
.wf--off i{animation-play-state:paused;height:5px}
@keyframes wfb{0%,100%{height:5px}50%{height:16px}}
.livehead{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--border-soft)}
.livehead__dot{width:9px;height:9px;border-radius:50%;background:var(--live);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.callbody{height:470px;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.bub{animation:bpop .34s var(--ease-out)}
@keyframes bpop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.bub--cust{align-self:flex-end;background:var(--lg-teal-100);border-radius:16px 16px 4px 16px;padding:12px 16px;font-weight:600;max-width:420px}
.ligrow{align-self:flex-start;display:flex;gap:10px;align-items:flex-end;max-width:460px}
.ligrow img{width:28px;height:28px;border-radius:50%;flex:none;border:1px solid var(--border-soft);background:var(--lg-paper)}
.bub--lig{background:var(--surface-sunken);border:1px solid var(--border-soft);border-radius:16px 16px 16px 4px;padding:12px 16px}
.bcap{font-size:12px;color:var(--text-muted);margin:-4px 0 0 38px}
.bcap--r{align-self:flex-end;margin:-4px 0 0}
.callchip{align-self:center;display:inline-flex;gap:8px;align-items:center;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-secondary);background:var(--surface-card);border:1px solid var(--border-soft);border-radius:var(--radius-pill);padding:6px 14px;box-shadow:var(--shadow-soft)}
.callchip i{width:7px;height:7px;border-radius:50%;background:var(--live)}
.callchip--accent i{background:var(--accent)}
.tdots{align-self:flex-start;display:inline-flex;gap:5px;padding:14px 16px;background:var(--surface-sunken);border:1px solid var(--border-soft);border-radius:16px 16px 16px 4px;margin-left:38px}
.tdots--cust{align-self:flex-end;background:var(--lg-teal-100);border:none;border-radius:16px 16px 4px 16px;margin-left:0}
.tdots i{width:6px;height:6px;border-radius:50%;background:var(--lg-ink-300);animation:tb 1s infinite}
.tdots--cust i{background:var(--lg-teal-600)}
.tdots i:nth-child(2){animation-delay:.15s}
.tdots i:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.pt-cap{align-self:stretch;background:var(--surface-inverse-deep);color:var(--text-inverse);border-radius:var(--radius-lg);padding:20px 24px;box-shadow:var(--shadow-float);margin-top:6px}
.pt-cap__label{display:inline-flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--lg-teal-400)}
.pt-cap__label::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live)}
.pt-cap p{margin:0;font-size:15px}
.rulechips{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rulechips .arr{color:var(--text-muted)}
.dorbig{font-family:var(--font-display);font-weight:800;font-size:clamp(30px,3.8vw,52px);letter-spacing:var(--track-display);line-height:1.1;max-width:920px;margin:0}
.dorbig .acc{color:var(--text-accent)}
.checklist{display:grid;grid-template-columns:1fr 1fr;gap:0 44px;margin-top:10px}
.checkitem{display:flex;gap:14px;padding:15px 0;border-top:1px solid var(--border-soft);font-weight:600;font-size:16px;align-items:baseline}
.checkitem b{color:var(--text-accent);font-family:var(--font-display);flex:none}
.startgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.startcard{border-top:2px solid var(--lg-ink-950);padding-top:18px;display:flex;flex-direction:column;gap:10px}
.startcard .sn{font-family:var(--font-display);font-weight:800;font-size:13px;letter-spacing:var(--track-caps);color:var(--text-accent)}
.startcard b{font-family:var(--font-display);font-size:var(--size-h4);font-weight:800;letter-spacing:var(--track-tight)}
.startcard p{margin:0;font-size:14.5px;color:var(--text-secondary)}
.faq-item{border-top:1px solid var(--border-soft)}
.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;cursor:pointer;background:none;border:none;text-align:left;font-family:var(--font-display);font-weight:800;font-size:clamp(19px,2.1vw,26px);letter-spacing:var(--track-tight);color:var(--text-body);transition:color var(--dur-fast) var(--ease-out)}
.faq-q:hover{color:var(--text-accent)}
.faq-q .pm{font-size:28px;line-height:1;color:var(--text-accent);transition:transform var(--dur-med) var(--ease-out);flex:none;font-weight:600}
.faq-item.open .pm{transform:rotate(45deg)}
.faq-a{overflow:hidden;max-height:0;transition:max-height .4s var(--ease-out)}
.faq-item.open .faq-a{max-height:300px}
.faq-a p{margin:0 0 26px;color:var(--text-secondary);max-width:660px}
.pricegrid{display:grid;grid-template-columns:1.12fr .88fr;gap:24px;margin-top:52px;align-items:stretch}
.pricegrid .lg-card{color:var(--text-body)}
.pricecard--ghost{background:transparent;border:1px solid rgba(251,252,248,.18);border-radius:var(--radius-lg);padding:36px;color:var(--text-inverse)}
.inclist{width:100%;margin-top:6px}
.incitem{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--border-soft);font-size:13.5px;color:var(--text-secondary);align-items:baseline}
.incitem b{color:var(--lg-teal-600);font-weight:700;flex:none}
.cta{background:var(--surface-inverse-deep);position:relative;overflow:hidden;padding:110px 0 120px;color:var(--text-inverse)}
.cta h2{font-size:clamp(64px,10vw,150px);font-weight:800;letter-spacing:var(--track-display);line-height:.96}
.cta .acc{color:var(--lg-orange-500)}
.cta-robot{position:absolute;right:3%;bottom:-40px;width:min(340px,28vw);aspect-ratio:1/1;object-fit:cover;border-radius:50%;pointer-events:none;box-shadow:var(--shadow-float)}
.bigword{font-family:var(--font-display);font-weight:800;letter-spacing:var(--track-display);font-size:clamp(120px,20vw,290px);line-height:.8;color:rgba(251,252,248,.07);user-select:none;pointer-events:none;text-align:center;margin:56px 0 -0.08em}
.toastwrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:70;animation:bpop .34s var(--ease-out)}
.wavedraw path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s var(--ease-out) .1s}
.wavedraw.on path{stroke-dashoffset:0}
@media (min-width:768px){.wavedraw{margin-top:32px!important}}
@media (max-width:920px){
.hero-grid{grid-template-columns:1fr!important}
.nav-links{display:none!important}
.hero-orbit{display:none}
.scrollhint{display:none}
.scene{height:auto}
.scene-pin{position:static;min-height:0}
.scene-grid{grid-template-columns:1fr!important;gap:28px!important}
.phases{min-height:0}
.ph{position:static;opacity:1;transform:none;margin-top:16px;pointer-events:auto}
.ph .lg-card{height:auto}
.rail,.scene-num{display:none}
.checklist{grid-template-columns:1fr}
.startgrid{grid-template-columns:1fr 1fr}
.pricegrid{grid-template-columns:1fr}
.mq b{font-size:38px}
.cta-robot{display:none}
.cta h2{font-size:clamp(50px,13vw,90px)}
}
@media (max-width:600px){
:root{--size-display:34px;--size-h3:21px;--size-body-lg:17px}
section{margin-top:64px!important}
#top,.cta{margin-top:0!important}
.ct{padding-left:22px!important;padding-right:22px!important}
.dor-ct{padding-top:56px!important;padding-bottom:60px!important}
.price-ct{padding-top:64px!important;padding-bottom:72px!important}
.hero-grid{padding-top:36px!important;gap:12px!important}
.hero-grid>div:first-child{padding-bottom:20px!important}
.hero-vis img{max-width:290px!important}
.hero-vis .lg-capsule{padding:12px 18px}
.hero-cta{margin-top:24px!important}
.hero-cta .lg-btn,.cta .lg-btn{white-space:normal;text-align:center;padding:14px 22px;font-size:15.5px;width:100%;justify-content:center;box-sizing:border-box}
.trustline{font-size:10.5px;letter-spacing:.12em}
.nav a img{height:25px!important}
.nav .lg-btn{padding:9px 13px;font-size:12.5px}
.nav .ct{gap:14px!important}
.startgrid{grid-template-columns:1fr}
.steps-word{font-size:34px}
.livehead{padding:14px 16px;gap:8px}
.livehead .wf{display:none}
.callbody{height:420px;padding:16px}
.faq-q{padding:18px 0;font-size:19px}
.mqwrap{margin-top:0;padding:16px 0;gap:6px}
.mq b{font-size:30px}
.mq--sm b{font-size:20px}
.mq__track{gap:26px}
.mq__dot{font-size:18px}
.cta{padding:72px 0 84px}
.toastwrap{width:calc(100vw - 32px)}
.toastwrap .lg-toast{width:100%;box-sizing:border-box;white-space:normal}
.bigword{margin-top:36px}
}
@media (prefers-reduced-motion:reduce){
.hd,.ln,.rv{opacity:1!important;transform:none!important}
.mq__track,.floaty,.rings i,.livehead__dot,.bub,.intro__t,.steps-word,.scene-num,.wf i,.scrollhint i::after{animation:none!important}
.wavedraw path,.hero-wave path{stroke-dashoffset:0}
.ph{position:static;opacity:1;transform:none;margin-top:16px}
.ph .lg-card{height:auto}
.phases{min-height:0}
.rail{display:none}
.scene{height:auto}
.scene-pin{position:static;min-height:0}
}
