        letter-spacing: 2.4px;
      }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#fbfcf8" />
  <circle cx="1005" cy="244" r="230" fill="none" stroke="#dbe7e7" stroke-width="2" />
  <circle cx="1005" cy="244" r="173" fill="none" stroke="#edf3f1" stroke-width="32" />

  <g transform="translate(62 42)">
