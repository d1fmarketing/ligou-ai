# Ligou cell config (cli-config.yaml — schema per /opt/hermes/cli-config.yaml.example).
#
# CORRECTION (RJ, 2026-08-19): the BRAIN runs on the ChatGPT SUBSCRIPTION via Codex OAuth — never an
# OpenAI API key. Only VOICE (gpt-realtime, WebRTC) uses the API, and that key lives in the controller.
# Provider "openai-codex" authenticates with the Codex OAuth token in this cell's ~/.hermes/auth.json
# (the same subscription Betano/Molusco use). No api_key anywhere in this file or the cell env.
#
# Model (RJ, 2026-08-19): gpt-5.6. The subscription exposes three variants — verified live against
# chatgpt.com/backend-api/codex/models:
#   gpt-5.6-sol   "Latest frontier agentic coding model"        <- chosen: best reasoning, cost is
#   gpt-5.6-terra "Balanced agentic coding model for everyday"     irrelevant on a subscription, and the
#   gpt-5.6-luna  "Fast and affordable agentic coding model"       brain runs post-call (latency non-critical)
# Override per cell with the HERMES_MODEL env var if a tenant ever needs terra/luna.
#
# Contained posture: gates ON; the cell holds NO business credentials (no Google/Supabase/Twilio/AWS).
model:
  default: "gpt-5.6-sol"          # ChatGPT subscription model (Codex OAuth)
  provider: "openai-codex"        # subscription via Codex OAuth — NOT openai-api
memory:
  write_approval: true
skills:
  write_approval: true
  guard_agent_created: true
database:
  journal_mode: "wal"
