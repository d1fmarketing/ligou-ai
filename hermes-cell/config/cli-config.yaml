# Ligou cell config (cli-config.yaml — schema per /opt/hermes/cli-config.yaml.example).
# Contained posture: gates ON; the cell's only external credential is its own OpenAI key.
model:
  default: "openai/gpt-5.5-mini"
  provider: "openai-api"
memory:
  write_approval: true
skills:
  write_approval: true
  guard_agent_created: true
database:
  journal_mode: "wal"
