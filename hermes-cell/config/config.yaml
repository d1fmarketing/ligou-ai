# Ligou cell config — CONTAINED posture (plan §princípios 5-6). Verify key names against the pinned release docs
# on first boot (hermes-agent.nousresearch.com/docs); this file is mounted read-only.
agent:
  name: Ligou
  # identity is shared product identity; per-tenant life lives in memory/skills, scoped by X-Hermes-Session-Key

memory:
  write_approval: true          # staged writes -> reviewed; NOT the real boundary (that is external), but on
skills:
  write_approval: true
  guard_agent_created: true

# dangerous surfaces OFF at start (plan: terminal, browser, web, autonomous skill activation, file mutation)
tools:
  terminal:
    enabled: false
  browser:
    enabled: false
  web_search:
    enabled: false
  file_write:
    enabled: false

api_server:
  enabled: true
  host: 0.0.0.0
  port: 8642
